name: 游戏规则验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run test:journey
      - run: npm run test:wilderness
      - run: npm run test:expedition
      - run: npm run test:homestead
      - run: npm run test:frontier
      - run: npm run test:odyssey
