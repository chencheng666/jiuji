<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九级 · 夜影观察室</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#dbe4e4;background:#0b141c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#203847 0,transparent 65%),#0b141c}main{max-width:1380px;margin:auto;padding:42px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:end}small,.eyebrow{color:#9fb7c6;letter-spacing:3px;font-size:12px}.eyebrow{color:#c5a77c}h1{font-size:42px;font-weight:600;letter-spacing:4px;margin:12px 0}header p{color:#9daeb7;line-height:1.8;font-size:14px;max-width:700px}nav{position:sticky;top:0;z-index:2;background:#0b141ced;border-block:1px solid #34424b;padding:15px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0 28px}button,select{font:inherit;border:1px solid #465764;background:#192a36;color:#dbe7ee;border-radius:7px;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{border-color:#c0a075;color:#f2d7b1;background:#453b32}nav label{margin-left:auto;font-size:13px;color:#9bafb9}section.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}article{background:#14222c;border:1px solid #34434e;border-radius:12px;overflow:hidden}article canvas{display:block;width:100%;aspect-ratio:4/3;background:radial-gradient(ellipse at 50% 55%,#2a3845,#101b25 75%)}article .copy{padding:19px 18px}h2{margin:0 0 8px;font-size:20px;letter-spacing:1px}article p{font-size:12px;color:#a5b6bf;line-height:1.8;margin:8px 0}b.badge{font-size:10px;letter-spacing:2px;color:#b7a2ba;font-weight:400}.scene{margin-top:32px;border:1px solid #34434e;border-radius:12px;overflow:hidden}.scene canvas{width:100%;height:430px;display:block}.scene header{padding:20px 24px;background:#14222c;align-items:center}.scene h2{font-size:20px}.scene p{margin:5px 0 0;font-size:12px}.foot{color:#8da2b0;font-size:12px;line-height:1.8;margin-top:24px}#measure{font-variant-numeric:tabular-nums;color:#b6c9d3;white-space:nowrap;font-size:12px}@media(max-width:900px){section.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}header{display:block}main{padding:24px 16px}nav label{margin-left:0}.scene canvas{height:380px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><header><div><div class="eyebrow">九级 / 生灵造型研究 02</div><h1>长夜里，阴影开始呼吸</h1><p>焦黑金属、流动暗质与碎裂玻璃。五类夜间生灵，以各自的骨骼和运动规则生长；旅人手中的一簇火，仍是荒野里的归途。</p></div><small>夜影观察室 · 4.2 视觉版</small></header>
<nav><button data-mode="stalk" aria-pressed="true">巡游</button><button data-mode="windup">技能蓄势</button><button data-mode="event">释放与撞击</button><button data-mode="rage">蚀者狂暴</button><button data-mode="roost">蝠群停栖</button><button id="pause">暂停动作</button><label>绘制预算 <select id="quality"><option value="auto">桌面 · 均衡</option><option value="mobile">手机 · 均衡</option><option value="smooth">手机 · 流畅</option><option value="reduced">减少动态</option></select></label><span id="measure"></span></nav>
<section class="grid" id="models"></section><section class="scene"><header><div><h2>回到真实的夜色</h2><p>复用游戏世界、夜幕与预警渲染。观察用状态副本，不读取或写入玩家存档。</p></div><select id="focus" aria-label="观察对象"></select></header><canvas id="world" aria-label="夜间场景"></canvas></section><p class="foot">模型由 Canvas 2D 实时绘制，非预渲染视频。近景卡片便于观察材质；下方场景使用游戏内夜色。技能演示不代表额外伤害或火光保护范围变化。</p></main>
<script type="module">
import {drawNightModel,NightModels} from './night-models.js';
import {NIGHT_ROSTER,stepNightCreatures} from './night-creatures.js';
import {WorldView} from './world.js';
import {createOdysseyGame,lightAt,walkable} from './survival.js';
const captions={scorpion:['01 / 油影与针肢','八条反折细肢，沥青般的暗质表面。紫电掠过刺尖，红色裂缝随蓄势张开。'],howler:['02 / 碎玻璃与冷光','长弯喙骨、针尖白眼，蓝色细流穿过裂缝。瞬移时从脚底逐行消隐，再从头部加载。'],boneboar:['03 / 灼裂金属','短腿、宽背和巨颅。背部钢筋与路牌在蓄势时收拢，受阻后弹起，震落火星。'],bloodbats:['04 / 翻滚的血云','独立膜翼沿群体轨道循环，向边缘散开又归队。靠近火光时转红，蓄势收成血箭。'],devourer:['05 / 负光核心','暗物质持续鼓泡变形，胸口留下漩涡状黑心。吞火后纹路短暂燃起，狂暴时蓝白电弧爬行。']};
const cards=[],grid=document.querySelector('#models'),view={nightModels:new NightModels(),quality:'auto',particles:true,mobile:false,reducedMotion:false};
for(const[kind,d]of Object.entries(NIGHT_ROSTER)){const a=document.createElement('article');a.innerHTML=`<canvas width="480" height="360" aria-label="${d.name}动态模型"></canvas><div class="copy"><b class="badge">${captions[kind][0]}</b><h2>${d.name}</h2><p>${captions[kind][1]}</p></div>`;grid.append(a);cards.push({kind,canvas:a.querySelector('canvas')});document.querySelector('#focus').add(new Option(d.name,kind));}
const world=new WorldView(document.querySelector('#world'));world.photo=true;world.reducedMotion=false;
let mode='stalk',paused=false,time=0,previous=0,frame=0,samples=[],scene=createScene('scorpion');
function createScene(kind){const s=createOdysseyGame(410);s.time=1750;s.player.x=1680;s.player.y=1740;s.player.direction='right';s.torchOn=true;s.torchFuel=90;s.buildings=[{id:'fire',type:'campfire',x:1570,y:1735,fuel:80}];s.enemies=[{id:'observed',kind,x:1940,y:1725,hp:NIGHT_ROSTER[kind].hp,cooldown:0,state:'stalk'}];s.nodes=s.nodes.filter(n=>Math.hypot(n.x-1840,n.y-1710)>120||!['tree','bush'].includes(n.type));world.camera={x:1780,y:1700};return s;}
document.querySelector('#focus').onchange=e=>{scene=createScene(e.target.value);world.nightModels.clear();};
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode=button.dataset.mode;for(const b of document.querySelectorAll('[data-mode]'))b.setAttribute('aria-pressed',String(b===button));};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续动作':'暂停动作';};
document.querySelector('#quality').onchange=e=>{view.mobile=e.target.value!=='auto';view.quality=e.target.value==='smooth'?'smooth':'auto';view.reducedMotion=e.target.value==='reduced';world.mobile=view.mobile;world.quality=view.quality;world.reducedMotion=view.reducedMotion;world.resize();samples=[];document.querySelector('#measure').textContent='采样中…';};
function actor(kind,t){const e={id:'study-'+kind,kind,x:120,y:158,hp:NIGHT_ROSTER[kind].hp,state:'stalk',headingX:1},u=t%2/2;
 if(mode==='windup'){const attack={scorpion:'poison',howler:'blink',boneboar:'charge',bloodbats:'bats',devourer:'snuff'}[kind];e.state='windup';e.warning={kind:attack,left:1-u,total:1,x:170,y:158};}
 if(mode==='event'){e.visualEvent={kind:{scorpion:'poison',howler:'blink',boneboar:'impact',bloodbats:'bats',devourer:'snuff'}[kind],at:t-t%1.6,ox:100,oy:158,x:165,y:158};}
 if(mode==='rage'&&kind==='devourer')e.hp=20;if(mode==='roost'&&kind==='bloodbats')e.state='burrow';return e;}
function draw(now){requestAnimationFrame(draw);if(now-previous<33||document.hidden)return;const dt=Math.min(.08,(now-previous)/1000||.033);previous=now;if(!paused)time+=dt;const start=performance.now();
 for(const{kind,canvas}of cards){const c=canvas.getContext('2d');c.clearRect(0,0,480,360);c.save();c.scale(2,2);const e=actor(kind,time),s={time,player:{x:250,y:158},buildings:mode==='windup'&&kind==='bloodbats'?[{type:'campfire',x:200,y:158,fuel:40}]:[]};if(kind==='devourer'&&mode==='rage'){c.translate(36,47);c.scale(.7,.7);}drawNightModel(c,s,e,view);drawNightModel(c,s,e,view,true);c.restore();}
 if(!paused){scene.time+=dt;if(scene.time>=1790)scene=createScene(document.querySelector('#focus').value);stepNightCreatures(scene,dt,{walkable,lightAt});scene.player.walk=0;}world.render(scene,dt);samples.push(performance.now()-start);if(samples.length>90)samples.shift();if(frame++%30===0&&samples.length>=30){const a=[...samples].sort((a,b)=>a-b);document.querySelector('#measure').textContent=`绘制提交 P95 ${a[Math.floor((a.length-1)*.95)].toFixed(1)} ms`;}
 window.nightObservation={time,mode,quality:view.quality,mobile:view.mobile,samples:[...samples],rigs:view.nightModels.rigs.size};}
requestAnimationFrame(draw);window.addEventListener('resize',()=>world.resize());
</script></body></html>
