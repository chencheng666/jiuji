<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九级 · 十二林木观察室</title><style>
:root{font-family:system-ui,sans-serif;color:#e0e7d8;background:#142521;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 40% 0,#385143,transparent 65%),#142521}main{max-width:1420px;margin:auto;padding:42px 30px}header{display:flex;align-items:end;justify-content:space-between;gap:20px}small{letter-spacing:4px;color:#c6b28c;font-size:11px}h1{font-size:40px;letter-spacing:4px;font-weight:600;margin:12px 0}header p{max-width:740px;color:#a8bdad;line-height:1.9;font-size:14px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#182b25ed;border-block:1px solid #51634d;padding:16px 0;margin:24px 0;position:sticky;top:0;z-index:2}button,select{font:inherit;background:#22372d;border:1px solid #62715b;color:#e2e6d5;border-radius:6px;padding:9px 16px;cursor:pointer}button[aria-pressed=true]{background:#8e845d;color:#fff3d0;border-color:#cbbd8c}label{margin-left:auto;color:#a7baa5;font-size:13px}#cache{font-size:12px;color:#a9beab;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}article{border:1px solid #506249;border-radius:10px;overflow:hidden;background:#1b3028}article canvas{display:block;width:100%;height:auto;background:radial-gradient(ellipse at 50% 75%,#52604866,transparent 70%)}.copy{padding:15px 19px 19px;min-height:144px}h2{font-size:21px;margin:0 0 9px;font-weight:550}.copy p{font-size:12px;line-height:1.9;color:#aebfa8;margin:8px 0}.copy span{font-size:10px;letter-spacing:2px;color:#d0bf94}.scene{border:1px solid #506249;border-radius:10px;overflow:hidden;margin-top:30px}.scene header{padding:20px 24px;background:#1b3028}.scene h2{margin:0}.scene p{margin:7px 0 0;font-size:12px}.scene canvas{display:block;width:100%;height:480px}.note{font-size:12px;color:#9db39f;line-height:1.9;margin:20px 0}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:25px 16px}h1{font-size:30px}header{display:block}label{margin-left:0}.scene canvas{height:380px}.copy{padding:13px;min-height:180px}.copy h2{font-size:18px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><div><small>九级 / 林木造型研究 01</small><h1>十二种树，四季的森林</h1><p>让白桦露出纸皮，让柳条垂入风里，让枫与银杏各有自己的秋色。主干、冠层与叶片分开生长，森林从同一种剪影变成可以辨认的地方。</p></div><small>程序模型 · 4.2 视觉版</small></header><div class="toolbar"><button data-season="0" aria-pressed="true">新芽春</button><button data-season="1">长昼夏</button><button data-season="2">丰收秋</button><button data-season="3">静雪冬</button><button id="motion">暂停风场</button><label>画面 <select id="quality"><option value="auto">桌面 · 均衡</option><option value="mobile">手机 · 均衡</option><option value="smooth">手机 · 流畅</option><option value="reduced">减少动态</option></select></label><span id="cache">模型生成中…</span></div><section class="grid" id="trees"></section><section class="scene"><header><div><h2>走进混交林</h2><p>同一份地图状态切换四季，原地树木保留种类与位置；此页不读取或写入玩家存档。</p></div><button id="winter-night">查看夜色</button></header><canvas id="world" aria-label="混交森林场景"></canvas></section><p class="note">观察卡片与游戏使用同一套 Canvas 程序模型。展示的是4.2 视觉版；树木材质和动态按距离与设备预算简化，未增加木材种类或采集负担。</p></main>
<script type="module">
import {TREE_SPECIES} from './tree-species.js';import {SceneArt} from './visual-scene.js';import {WorldView} from './world.js';import {createOdysseyGame} from './survival.js';
const art=new SceneArt(),view={mobile:false,quality:'auto',reducedMotion:false},cards=[],grid=document.querySelector('#trees');
for(const[id,d]of Object.entries(TREE_SPECIES)){const a=document.createElement('article');a.innerHTML=`<canvas width="440" height="520" aria-label="${d.name}程序模型"></canvas><div class="copy"><span>${d.evergreen?'常绿 / 针叶与革质叶':'落叶 / 独立秋色与冬枝'}</span><h2>${d.name}</h2><p>${d.tip}</p></div>`;grid.append(a);cards.push({id,canvas:a.querySelector('canvas')});}
const canvas=document.querySelector('#world'),world=new WorldView(canvas),s=createOdysseyGame(410);world.photo=true;world.camera={x:1250,y:1120};s.player.x=1250;s.player.y=1200;s.player.direction='right';s.torchOn=true;s.torchFuel=90;
s.nodes=s.nodes.filter(n=>Math.hypot(n.x-1250,n.y-1120)>380);const ids=Object.keys(TREE_SPECIES);for(let i=0;i<12;i++)s.nodes.push({id:'forest-study-'+i,type:'tree',treeSpecies:ids[i],x:920+i%6*135,y:1000+Math.floor(i/6)*230,hp:3,available:true,respawnAt:0});s.buildings=[{id:'fire',type:'campfire',x:1250,y:1205,fuel:100}];
let season=0,time=0,paused=false,night=false,last=0,frames=0;
for(const b of document.querySelectorAll('[data-season]'))b.onclick=()=>{season=Number(b.dataset.season);for(const x of document.querySelectorAll('[data-season]'))x.setAttribute('aria-pressed',String(x===b));};
document.querySelector('#motion').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续风场':'暂停风场';};
document.querySelector('#winter-night').onclick=e=>{night=!night;e.target.textContent=night?'返回白昼':'查看夜色';};
document.querySelector('#quality').onchange=e=>{const q=e.target.value;view.mobile=['mobile','smooth'].includes(q);view.quality=q==='smooth'?'smooth':'auto';view.reducedMotion=q==='reduced';world.mobile=view.mobile;world.quality=view.quality;world.reducedMotion=view.reducedMotion;art.clear();world.sceneArt.clear();world.resize();};
function draw(now){requestAnimationFrame(draw);if(now-last<50||document.hidden)return;const dt=Math.min(.1,(now-last)/1000||.05);last=now;if(!paused)time+=dt;const current=season*1200+(night?250:80)+time%50;
 for(const{id,canvas}of cards){const r=canvas.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;const c=canvas.getContext('2d');c.clearRect(0,0,440,520);c.save();c.scale(2,2);const node={id:'study-'+id,type:'tree',treeSpecies:id,x:110,y:241},state={time:current,seed:410,player:{x:110,y:241},expedition:{current:'home'}};art.draw(c,node,state,view,145);c.restore();}
 s.time=current;world.render(s,dt);if(frames++%10===0)document.querySelector('#cache').textContent=`近景缓存 ${(art.bytes/1048576).toFixed(1)} MiB`;
 window.forestObservation={season,time,mobile:view.mobile,quality:view.quality,reduced:view.reducedMotion,bytes:art.bytes,worldBytes:world.sceneArt.bytes,models:cards.length,treeSpecies:s.nodes.filter(n=>n.type==='tree').map(n=>n.treeSpecies)};
}requestAnimationFrame(draw);window.addEventListener('resize',()=>world.resize());
</script></body></html>
